
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - CineMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>CineMatch</h1>
        <p>Movies recommended for you</p>
    </header>

    <main>

        <section class="selected-movie">
            <h2>Selected Movie</h2>

            {% if selected_movie.poster_path %}
            <img
                src="https://image.tmdb.org/t/p/w500{{ selected_movie.poster_path }}"
                alt="{{ selected_movie.title }}"
            >
            {% endif %}

            <h3>{{ selected_movie.title }}</h3>
        </section>


        <section class="recommendations">
            <h2>Recommended Movies</h2>

            <div class="movie-grid">

                {% for movie in recommendations %}
                <div class="movie-card">

                    {% if movie.poster_path %}
                    <img
                        src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}"
                        alt="{{ movie.title }}"
                    >
                    {% endif %}

                    <h3>{{ movie.title }}</h3>
                    <p>{{ movie.genres }}</p>

                </div>
                {% endfor %}

            </div>
        </section>

        <a href="{{ url_for('home') }}">← Back to Home</a>

    </main>

</body>
</html>
